{% extends "base.html" %}
{% block title %}Inicio{% endblock %}

{% block content %}
<section class="ys-hero">
    <span class="ys-eyebrow">👑 Sistema de gestión</span>
    <h1 class="ys-titulo">YS Empire</h1>
    <p class="ys-subtitulo">tus gustos, nuestros productos</p>
    <div class="ys-cta">
        <a href="/productos/" class="btn-erp-gold">Ver productos</a>
        <a href="/ventas/" class="btn-erp-primary">Ir a ventas</a>
    </div>
</section>

<div class="row g-3">
    {% for m in modulos %}
    <div class="col-md-4">
        <div class="erp-card ys-modulo" onclick="window.location='{{ m.url }}'">
            <div class="ys-modulo-icono">{{ m.icono }}</div>
            <div>
                <span class="ys-modulo-nombre">{{ m.nombre }}</span>
                <span class="ys-modulo-desc">{{ m.descripcion }}</span>
            </div>
            <span class="ys-flecha">→</span>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
